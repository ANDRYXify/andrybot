<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SocialBot — Overlay effetti</title>
  <style>
    /* Sfondo TRASPARENTE: in OBS si vede solo l'effetto, non la pagina. */
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      background: transparent;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    /* Il "palco": area centrale dove compaiono immagini e video. */
    #palco {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }
    .effetto {
      max-width: 80vw;
      max-height: 80vh;
      opacity: 0;
      transform: scale(.9);
      transition: opacity .28s ease, transform .28s ease;
      filter: drop-shadow(0 10px 40px rgba(0, 0, 0, .55));
      border-radius: 8px;
    }
    .effetto.dentro { opacity: 1; transform: scale(1); }

    /* Etichetta con il nome del comando (usata soprattutto per gli audio). */
    #etichette {
      position: fixed;
      left: 0; right: 0; bottom: 7vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: .5rem;
      pointer-events: none;
    }
    .pillola {
      background: rgba(145, 70, 255, .85);
      color: #fff;
      font-weight: 800;
      font-size: 1.6rem;
      letter-spacing: .02em;
      padding: .4rem 1.1rem;
      border-radius: 999px;
      text-shadow: 0 2px 8px rgba(0, 0, 0, .5);
      box-shadow: 0 8px 30px rgba(0, 0, 0, .45);
      opacity: 0;
      transform: translateY(12px);
      transition: opacity .25s ease, transform .25s ease;
    }
    .pillola.dentro { opacity: 1; transform: translateY(0); }

    /* Testo a schermo (azione "overlayTesto" dei Moduli): centrato, con fade. */
    #testi {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      padding: 0 6vw;
    }
    .testo-overlay {
      max-width: 84vw;
      text-align: center;
      color: #fff;
      font-weight: 800;
      font-size: 3.2rem;
      line-height: 1.15;
      letter-spacing: .01em;
      text-shadow: 0 3px 18px rgba(0, 0, 0, .7), 0 0 2px rgba(0, 0, 0, .9);
      opacity: 0;
      transform: translateY(14px) scale(.98);
      transition: opacity .3s ease, transform .3s ease;
      word-break: break-word;
    }
    .testo-overlay.dentro { opacity: 1; transform: translateY(0) scale(1); }

    /* Contatore PENITENZE: un riquadro con la parola vietata e quante volte è
       stata "beccata"; a ogni colpo sale un "+1" rosso. Posizione impostabile. */
    #penitenze {
      position: fixed;
      display: flex;
      flex-direction: column;
      gap: .6rem;
      pointer-events: none;
      z-index: 5;
    }
    #penitenze.alto-sinistra  { top: 4vh;  left: 3vw; align-items: flex-start; }
    #penitenze.alto-destra    { top: 4vh;  right: 3vw; align-items: flex-end; }
    #penitenze.basso-sinistra { bottom: 4vh; left: 3vw; align-items: flex-start; }
    #penitenze.basso-destra   { bottom: 4vh; right: 3vw; align-items: flex-end; }
    #penitenze.alto-centro    { top: 4vh;  left: 50%; transform: translateX(-50%); align-items: center; }
    #penitenze.basso-centro   { bottom: 4vh; left: 50%; transform: translateX(-50%); align-items: center; }
    .pen-card {
      position: relative;
      background: rgba(15, 15, 20, .82);
      border: 2px solid var(--pen-colore, #ff2d2d);
      border-radius: 14px;
      padding: .55rem 1rem;
      color: #fff;
      font-weight: 800;
      box-shadow: 0 10px 34px rgba(0, 0, 0, .5);
      opacity: 0;
      transform: translateY(-8px) scale(.96);
      transition: opacity .3s ease, transform .3s ease;
      display: flex;
      align-items: center;
      gap: .6rem;
      white-space: nowrap;
    }
    .pen-card.dentro { opacity: 1; transform: translateY(0) scale(1); }
    .pen-card .pen-parola { font-size: 1.15rem; letter-spacing: .01em; }
    .pen-card .pen-parola small { display: block; font-size: .72rem; font-weight: 700; opacity: .8; letter-spacing: .04em; text-transform: uppercase; }
    .pen-card .pen-num {
      min-width: 2.2rem; text-align: center;
      background: var(--pen-colore, #ff2d2d);
      color: #fff; font-size: 1.5rem; line-height: 1;
      padding: .28rem .5rem; border-radius: 10px;
      text-shadow: 0 2px 6px rgba(0, 0, 0, .4);
    }
    .pen-card.colpito { animation: pen-scossa .32s ease; }
    @keyframes pen-scossa { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
    .pen-card .pen-esito { font-size: 1rem; font-weight: 800; }
    /* "+1" che sale e sfuma */
    .pen-piu {
      position: absolute; top: -.2rem; right: .6rem;
      color: var(--pen-colore, #ff2d2d);
      font-weight: 900; font-size: 1.9rem;
      text-shadow: 0 2px 10px rgba(0, 0, 0, .6);
      animation: pen-sale 1s ease forwards;
    }
    @keyframes pen-sale { 0% { opacity: 0; transform: translateY(6px) scale(.8); } 20% { opacity: 1; } 100% { opacity: 0; transform: translateY(-42px) scale(1.15); } }

    /* ALERT eventi (follow/sub/cheer/raid): un cartello animato che entra e sfuma. */
    #alert {
      position: fixed; left: 0; right: 0;
      display: flex; justify-content: center; pointer-events: none; z-index: 8;
    }
    #alert.alto-centro    { top: 8vh; align-items: flex-start; }
    #alert.centro         { top: 50%; transform: translateY(-50%); }
    #alert.basso-centro   { bottom: 10vh; top: auto; align-items: flex-end; }
    .alert-card {
      --acc: #9146ff;
      min-width: 340px; max-width: 74vw;
      background: rgba(15, 15, 20, .9);
      border: 2px solid var(--acc);
      border-radius: 18px;
      padding: 1.1rem 1.6rem;
      text-align: center; color: #fff;
      box-shadow: 0 16px 50px rgba(0, 0, 0, .55), 0 0 30px color-mix(in srgb, var(--acc) 40%, transparent);
      opacity: 0; transform: translateY(-18px) scale(.94);
      transition: opacity .35s ease, transform .35s cubic-bezier(.2,.8,.2,1);
    }
    .alert-card.dentro { opacity: 1; transform: translateY(0) scale(1); }
    .alert-card .alert-ico { width: 46px; height: 46px; margin: 0 auto .35rem; color: var(--acc); }
    .alert-card .alert-ico svg { width: 100%; height: 100%; }
    .alert-card .alert-testo { font-size: 1.7rem; font-weight: 800; line-height: 1.15; text-shadow: 0 2px 10px rgba(0,0,0,.5); }
    .alert-card .alert-testo b { color: var(--acc); }

    /* CHAT a schermo: una colonna di messaggi recenti in un angolo. */
    #chatlive {
      position: fixed; display: flex; flex-direction: column; gap: .35rem;
      max-width: 30vw; pointer-events: none; z-index: 6;
    }
    #chatlive.alto-sinistra  { top: 3vh; left: 2vw; }
    #chatlive.alto-destra    { top: 3vh; right: 2vw; align-items: flex-end; }
    #chatlive.basso-sinistra { bottom: 3vh; left: 2vw; }
    #chatlive.basso-destra   { bottom: 3vh; right: 2vw; align-items: flex-end; }
    #chatlive.dim-piccola .chat-riga { font-size: .85rem; }
    #chatlive.dim-media   .chat-riga { font-size: 1.05rem; }
    #chatlive.dim-grande  .chat-riga { font-size: 1.3rem; }
    .chat-riga {
      background: rgba(15, 15, 20, .78);
      border-radius: 10px; padding: .3rem .6rem; color: #f2f2f5;
      box-shadow: 0 4px 16px rgba(0, 0, 0, .4);
      opacity: 0; transform: translateX(-10px);
      transition: opacity .25s ease, transform .25s ease;
      word-break: break-word; line-height: 1.3;
    }
    #chatlive.alto-destra .chat-riga, #chatlive.basso-destra .chat-riga { transform: translateX(10px); }
    .chat-riga.dentro { opacity: 1; transform: translateX(0); }
    .chat-riga .chat-user { font-weight: 800; margin-right: .35rem; }
    .chat-riga.uscita { opacity: 0; transform: translateY(-6px); }
  </style>
</head>
<body>
  <div id="palco"></div>
  <div id="etichette"></div>
  <div id="testi"></div>
  <div id="penitenze"></div>
  <div id="alert"></div>
  <div id="chatlive"></div>

  <script src="/presets.js"></script>
  <script>
    'use strict';

    // --- ricava login e chiave dalla URL corrente -----------------------
    // percorso atteso: /overlay/<login>   ·   query: ?key=...
    const parti = location.pathname.split('/').filter(Boolean); // ['overlay', '<login>']
    const login = parti[1] || '';
    const urlStream = '/overlay/' + encodeURIComponent(login) + '/stream' + location.search;

    const palco = document.getElementById('palco');
    const etichette = document.getElementById('etichette');
    const testi = document.getElementById('testi');
    const penBox = document.getElementById('penitenze');
    const alertBox = document.getElementById('alert');
    const chatBox = document.getElementById('chatlive');

    // --- coda per gli effetti VISIVI (immagini/video): uno alla volta -----
    const codaVisiva = [];
    let occupato = false;

    function mostraProssimo() {
      if (occupato || !codaVisiva.length) return;
      occupato = true;
      const ev = codaVisiva.shift();
      if (ev.tipo === 'immagine') mostraImmagine(ev);
      else if (ev.tipo === 'video') mostraVideo(ev);
      else finito();
    }

    function finito() {
      occupato = false;
      // piccola pausa tra un effetto e l'altro
      setTimeout(mostraProssimo, 120);
    }

    function durataMs(ev, fallback) {
      const n = Number(ev.durata);
      return Number.isFinite(n) && n > 0 ? n : fallback;
    }

    function volume01(ev) {
      const n = Number(ev.volume);
      const v = Number.isFinite(n) ? n : 100;
      return Math.min(1, Math.max(0, v / 100));
    }

    function mostraImmagine(ev) {
      const img = document.createElement('img');
      img.className = 'effetto';
      img.src = ev.url;
      palco.appendChild(img);
      requestAnimationFrame(() => img.classList.add('dentro'));
      etichettaVolatile(ev.comando, durataMs(ev, 5000));
      setTimeout(() => {
        img.classList.remove('dentro');
        setTimeout(() => { img.remove(); finito(); }, 320);
      }, durataMs(ev, 5000));
    }

    function mostraVideo(ev) {
      const v = document.createElement('video');
      v.className = 'effetto';
      v.src = ev.url;
      v.autoplay = true;
      v.playsInline = true;
      v.volume = volume01(ev);
      palco.appendChild(v);
      requestAnimationFrame(() => v.classList.add('dentro'));
      etichettaVolatile(ev.comando, 1800);

      let chiuso = false;
      const chiudi = () => {
        if (chiuso) return;
        chiuso = true;
        v.classList.remove('dentro');
        setTimeout(() => { try { v.pause(); } catch (e) {} v.remove(); finito(); }, 320);
      };
      v.addEventListener('ended', chiudi);
      v.addEventListener('error', chiudi);
      v.play().catch(() => {});
      // rete di sicurezza: chiudi comunque dopo la durata indicata
      setTimeout(chiudi, durataMs(ev, 8000) + 600);
    }

    // Gli audio possono sovrapporsi: li suoniamo subito, senza coda.
    function suona(ev) {
      try {
        const a = new Audio(ev.url);
        a.volume = volume01(ev);
        a.play().catch(() => {});
      } catch (e) { /* audio non riproducibile: pazienza */ }
      etichettaVolatile(ev.comando, 1600);
    }

    // Suono PRESET sintetizzato (nessun file): usa la libreria condivisa.
    function suonaPreset(ev) {
      try { window.SUONI_PRESET && window.SUONI_PRESET.suona(ev.preset, ev.volume); } catch (e) { /* niente */ }
      etichettaVolatile(ev.comando, 1600, false);   // titolo del premio, senza '!'
    }

    // Mostra un testo libero al centro dello schermo per `durata` ms, con fade.
    // Usato dall'azione "overlayTesto" dei Moduli (payload { tipo:'testo', testo, durata }).
    function mostraTesto(ev) {
      const t = String(ev.testo || '').slice(0, 400);
      if (!t) return;
      const durata = durataMs(ev, 5000);
      const el = document.createElement('div');
      el.className = 'testo-overlay';
      el.textContent = t;                     // textContent: niente HTML, niente injection
      testi.appendChild(el);
      requestAnimationFrame(() => el.classList.add('dentro'));
      setTimeout(() => {
        el.classList.remove('dentro');
        setTimeout(() => el.remove(), 320);
      }, durata);
    }

    // --- contatore PENITENZE ---------------------------------------------
    const penCard = {};   // id → elemento .pen-card

    function penitenza(ev) {
      if (ev.azione === 'start') penStart(ev);
      else if (ev.azione === 'hit') penHit(ev);
      else if (ev.azione === 'end') penEnd(ev);
    }

    function penStart(ev) {
      penBox.className = ev.posizione || 'alto-destra';
      if (ev.colore) penBox.style.setProperty('--pen-colore', ev.colore);
      const parola = String(ev.valore || '').toUpperCase();
      const eti = ev.modo === 'solo' ? 'dì solo' : 'vietata';
      const card = document.createElement('div');
      card.className = 'pen-card';
      card.innerHTML = '<span class="pen-parola"><small>' + eti + '</small>' + escHtml(parola) + '</span><span class="pen-num">0</span>';
      penBox.appendChild(card);
      penCard[ev.id] = card;
      requestAnimationFrame(() => card.classList.add('dentro'));
    }

    function penHit(ev) {
      const card = penCard[ev.id];
      if (!card) return;
      const num = card.querySelector('.pen-num');
      if (num) num.textContent = String(ev.count);
      card.classList.remove('colpito');
      void card.offsetWidth;               // riavvia l'animazione
      card.classList.add('colpito');
      const piu = document.createElement('div');
      piu.className = 'pen-piu';
      piu.textContent = '+' + (ev.inc || 1);
      card.appendChild(piu);
      setTimeout(() => piu.remove(), 1000);
    }

    function penEnd(ev) {
      const card = penCard[ev.id];
      if (!card) return;
      const esito = ev.count > 0
        ? '💀 PENITENZA: ' + escHtml(String(ev.penitenza || '')) + (ev.count > 1 ? ' ×' + ev.count : '')
        : '✅ Salvo!';
      card.innerHTML = '<span class="pen-esito">' + esito + '</span>';
      setTimeout(() => {
        card.classList.remove('dentro');
        setTimeout(() => { card.remove(); delete penCard[ev.id]; }, 400);
      }, ev.count > 0 ? 6000 : 2500);
    }

    function escHtml(s) {
      return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    // --- ALERT eventi (coda: uno alla volta) -----------------------------
    const codaAlert = [];
    let alertOccupato = false;
    const ALERT_ICO = {
      follow: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>',
      sub: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 15.09 8.26 22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>',
      cheer: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m13 2-3 7h5l-3 7"/><circle cx="12" cy="12" r="9"/></svg>',
      raid: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 11 18-5v12L3 14v-3z"/><path d="M11.6 16.8a3 3 0 1 1-5.8-1.6"/></svg>',
    };

    function alert(ev) { codaAlert.push(ev); mostraAlertProssimo(); }

    function mostraAlertProssimo() {
      if (alertOccupato || !codaAlert.length) return;
      alertOccupato = true;
      const ev = codaAlert.shift();
      alertBox.className = ev.posizione || 'alto-centro';
      const card = document.createElement('div');
      card.className = 'alert-card';
      if (ev.colore) card.style.setProperty('--acc', ev.colore);
      // grassetto sul primo "token" (di solito il nome utente all'inizio del testo)
      const testoHtml = escHtml(ev.testo || '').replace(/^(\S+)/, '<b>$1</b>');
      card.innerHTML = '<div class="alert-ico">' + (ALERT_ICO[ev.kind] || ALERT_ICO.follow) + '</div><div class="alert-testo">' + testoHtml + '</div>';
      alertBox.appendChild(card);
      requestAnimationFrame(() => card.classList.add('dentro'));
      try { if (ev.suono && window.SUONI_PRESET) window.SUONI_PRESET.suona(ev.suono, 100); } catch (e) { /* niente */ }
      const durata = Math.max(2000, Number(ev.durata) || 6000);
      setTimeout(() => {
        card.classList.remove('dentro');
        setTimeout(() => { card.remove(); alertOccupato = false; setTimeout(mostraAlertProssimo, 250); }, 400);
      }, durata);
    }

    // --- CHAT a schermo --------------------------------------------------
    function chat(ev) {
      chatBox.className = (ev.posizione || 'basso-sinistra') + ' dim-' + (ev.dim || 'media');
      const riga = document.createElement('div');
      riga.className = 'chat-riga';
      const u = document.createElement('span');
      u.className = 'chat-user';
      u.textContent = ev.user || '';
      if (ev.colore) u.style.color = ev.colore;
      riga.appendChild(u);
      riga.appendChild(document.createTextNode(ev.testo || ''));
      chatBox.appendChild(riga);
      requestAnimationFrame(() => riga.classList.add('dentro'));
      // tieni solo gli ultimi N
      const max = Math.max(1, Number(ev.max) || 8);
      while (chatBox.children.length > max) chatBox.firstChild.remove();
      // sparizione a tempo (0 = restano finché non escono dalla coda)
      const fade = Math.max(0, Number(ev.fadeSec) || 0);
      if (fade > 0) setTimeout(() => {
        riga.classList.add('uscita');
        setTimeout(() => riga.remove(), 400);
      }, fade * 1000);
    }

    // Mostra il nome del comando in una pillola che compare e sfuma.
    // conPrefisso=true → antepone '!' (comandi chat); false → testo così com'è
    // (es. titolo di un premio a punti canale).
    function etichettaVolatile(comando, durata, conPrefisso = true) {
      if (!comando) return;
      const el = document.createElement('div');
      el.className = 'pillola';
      el.textContent = (conPrefisso ? '!' : '') + comando;
      etichette.appendChild(el);
      requestAnimationFrame(() => el.classList.add('dentro'));
      setTimeout(() => {
        el.classList.remove('dentro');
        setTimeout(() => el.remove(), 300);
      }, Math.max(800, durata));
    }

    // --- connessione SSE (riconnessione automatica nativa) ---------------
    function connetti() {
      const es = new EventSource(urlStream);
      es.onmessage = (m) => {
        let dati;
        try { dati = JSON.parse(m.data); } catch (e) { return; }
        if (!dati || !dati.tipo) return;
        if (dati.tipo === 'audio') suona(dati);
        else if (dati.tipo === 'preset') suonaPreset(dati);
        else if (dati.tipo === 'penitenza') penitenza(dati);
        else if (dati.tipo === 'alert') alert(dati);
        else if (dati.tipo === 'chat') chat(dati);
        else if (dati.tipo === 'testo') mostraTesto(dati);
        else { codaVisiva.push(dati); mostraProssimo(); }
      };
      // in caso di errore EventSource riprova da solo: non facciamo nulla
      es.onerror = () => {};
    }

    if (login) connetti();
  </script>
</body>
</html>
