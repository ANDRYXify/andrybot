# Il collaudo gira a ogni push e a ogni pull request. Non è un rituale: è la
# rete che tiene ciò che è già stato pagato una volta — il contratto sullo stile
# dell'overlay, i piani a pagamento, la cifratura dei token, la libreria dei
# media, l'antispam, e i cancelli sui file che arrivano al browser.
name: collaudo

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  prove:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    name: prove su Node ${{ matrix.node }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: installa le dipendenze
        run: npm ci --no-audit --no-fund

      - name: il progetto si carica davvero
        run: node --check src/index.js && node -e "import('./src/web/stile.js').then(()=>console.log('moduli ok'))"
        env:
          DATA_DIR: ${{ runner.temp }}/dati

      - name: prove
        run: npm test
        env:
          DATA_DIR: ${{ runner.temp }}/dati
