# ============================================================
#  AndryBot — stack di produzione
#  - bot:   Node 22 (dashboard + chat Twitch), solo rete interna
#  - brain: cervello Python isolato (coscienza + modello linguistico)
#  - caddy: reverse proxy con HTTPS automatico (Let's Encrypt)
#  Avvio:  docker compose up -d --build
#
#  Robustezza sotto carico (aggiunta): ogni servizio ha i log a rotazione
#  (un flood non riempie il disco), un tetto ai processi (niente fork-bomb),
#  più descrittori di file aperti (regge molte connessioni insieme) e nessuna
#  scalata di privilegi. Il bot ha anche un controllo di salute: se smette di
#  rispondere Docker lo segna. Le difese al volo dei flood applicativi stanno
#  nel codice (src/web/esche.js) e in Caddy.
# ============================================================

# Impostazioni comuni: log a rotazione + nessuna scalata di privilegi. Un flood
# genera montagne di righe di log: senza rotazione riempirebbero il disco e
# sarebbe QUELLO a mettere giù il server, non l'attacco.
x-comune: &comune
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  bot:
    <<: *comune
    build: .
    env_file: .env
    volumes:
      # Database e memoria del bot: bind sul disco del server. Sopravvive a
      # riavvii e rebuild. (Per un volume più robusto contro re-clone/git clean
      # vedi il README: va fatto CON migrazione dei dati, mai a secco.)
      - ./data:/app/data
    expose:
      # Porta interna: la vede solo Caddy, NON è aperta su internet.
      - "8090"
    # Tetto ai processi (niente fork-bomb) e più file aperti insieme: così regge
    # molte connessioni contemporanee — comprese quelle tenute apposta lente
    # alle esche — senza restare a corto di descrittori.
    pids_limit: 1024
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    # Se il bot smette di rispondere, Docker lo segna "unhealthy". start_period
    # generoso: al primo avvio non deve essere dichiarato malato mentre parte.
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:8090/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    depends_on:
      - brain

  # Il "cervello" che parla con parole sue: gira ISOLATO, così qualunque cosa
  # faccia (pensare, caricare il modello) NON rallenta il bot → comandi sempre
  # istantanei. Il bot lo raggiunge su http://brain:8091 (solo rete interna).
  brain:
    <<: *comune
    build: ./brain
    env_file: .env
    # IMPORTANTISSIMO — persistenza del cervello di Lia.
    # Il brain gira con WORKDIR /app/brain (diverso dal bot, che sta in /app).
    # Se DATA_DIR arriva *relativo* da .env (es. ./data, che al bot va benissimo
    # perché il suo cwd è /app), qui dentro diventa /app/brain/data: una cartella
    # NON montata, che sparisce a ogni `docker compose up --build`. È per questo
    # che coscienza.db e rete/ svanivano e "Lia rinasceva da zero" ogni deploy.
    # Questo override forza il percorso ASSOLUTO già montato su ./data: vince su
    # env_file e sul Dockerfile, così la memoria di Lia finisce SEMPRE sul disco
    # del server e sopravvive per davvero ai redeploy.
    environment:
      - DATA_DIR=/app/data
      # L'ecosistema di Lia vive DIETRO il guardiano (il firewall d'uscita): l'esecutore
      # ascolta nella rete del guardiano, quindi il cervello lo raggiunge lì.
      - AMBIENTE_URL=${AMBIENTE_URL:-http://guardiano:8099}
    volumes:
      - ./data:/app/data      # coscienza (memoria) + modelli, persistono qui
    expose:
      - "8091"
    # Il modello linguistico può aprire diversi file: alziamo anche qui il tetto.
    # NIENTE mem_limit sul brain: la memoria di un LLM è imprevedibile e un tetto
    # troppo basso lo farebbe uccidere a metà di un pensiero. Se vuoi un limite,
    # misura prima quanto consuma (docker stats) e lascia margine abbondante.
    pids_limit: 512
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    # Il cervello sta sulla rete interna (per bot/Caddy) E su `sandbox`, l'unico
    # ponte verso l'AMBIENTE di Lia: così è LUI a comandare la sandbox, e la
    # sandbox non tocca il resto.
    networks:
      - default
      - sandbox

  # ── GUARDIANO: il firewall d'USCITA dell'ecosistema di Lia ─────────────────
  # L'`ambiente` condivide la rete di questo container (network_mode più sotto): così TUTTO il
  # traffico di Lia passa da qui. Le regole (guardiano/entrypoint.sh) le lasciano internet
  # PUBBLICO vero, ma le SBARRANO ogni connessione nuova verso reti private/interne/metadati —
  # cioè verso la TUA infrastruttura (bot, Caddy, host, dati). È il muro che rende l'ecosistema
  # reale ma non-weaponizzabile: anche se qualcuno arrivasse dentro, non raggiunge la produzione.
  guardiano:
    <<: *comune
    build: ./guardiano
    cap_add:
      - NET_ADMIN                   # solo per posare le regole del firewall (nient'altro)
    # sta su `sandbox`: da qui parla col cervello (che comanda l'esecutore) e ha internet.
    networks:
      - sandbox
    # non serve mem grande: è solo un cancello.
    mem_limit: 64m
    pids_limit: 64

  # ── AMBIENTE di Lia: il suo "computer" personale, SANDBOXATO ──────────────
  # Un mondo tutto suo dove ha mano libera (uno SCHERMO vero con un browser vero che
  # resta aperto fra un gesto e l'altro, shell, Python, file, rete in uscita),
  # ma murato dal resto: sta SOLO sulla rete `sandbox` (non vede bot/Caddy né i
  # loro dati/token/pagamenti), non riceve NESSUN segreto (solo la sua chiave),
  # gira come utente non privilegiato con root in sola lettura, senza capability,
  # e con tetti a RAM/CPU/processi. Lo pilota solo il cervello, in privato con te.
  ambiente:
    <<: *comune
    build: ./ambiente
    # NIENTE env_file: la sandbox non deve MAI vedere i segreti. Le passo solo la
    # chiave condivisa dell'esecutore (per farsi comandare dal cervello).
    environment:
      - AMBIENTE_KEY=${AMBIENTE_KEY:-}
      - AMBIENTE_PORT=8099
      # Quanto può durare un comando in primo piano. Era mezzo minuto, ed era il vero
      # guinzaglio: in trenta secondi non ci sta una navigazione vera. Per ciò che dura
      # di più resta il lavoro in background, che non ha tetto.
      - AMBIENTE_TIMEOUT_MAX=${AMBIENTE_TIMEOUT_MAX:-120}
      # Lo SCHERMO su cui vive il suo browser. Le porte del vetro da cui lo si guarda
      # (5900 VNC, 6080 noVNC) e quella del browser (8100) restano dentro la rete del
      # guardiano: nessuna di queste si affaccia su internet.
      - DISPLAY=:99
      - SCHERMO_LARG=${SCHERMO_LARG:-1440}
      - SCHERMO_ALT=${SCHERMO_ALT:-900}
    # LA RETE È QUELLA DEL GUARDIANO: tutto il traffico di Lia passa dal firewall d'uscita
    # (internet pubblico sì, la tua infra no). Perciò niente `networks`/`expose` propri: la
    # porta 8099 vive nella rete del guardiano, dove il cervello la raggiunge.
    network_mode: "service:guardiano"
    depends_on:
      - guardiano
    # confini duri della sandbox
    read_only: true                 # root in sola lettura: niente manomissioni al sistema
    cap_drop:
      - ALL                         # nessuna capability: root qui non serve e non c'è
    # RISORSE LIMITATE MA LIBERTÀ: le diamo respiro vero per ragionare (scrivere ed
    # eseguire programmi, tenere aperto un browser CON la finestra su uno schermo vero),
    # restando sotto un tetto che NON può soffocare il server (16 GB totali). Regolabili
    # via env se serve stringere o allargare.
    mem_limit: ${AMBIENTE_MEM:-4g}  # schermo + browser aperto + il suo lavoro
    cpus: "${AMBIENTE_CPUS:-2}"     # un browser vero disegna davvero: gli serve CPU
    pids_limit: 512                 # abbastanza per programmi veri, non per una fork-bomb
    tmpfs:
      # Qui ci vivono anche il socket dello schermo (/tmp/.X11-unix) e i temporanei di
      # Chromium: con la root in sola lettura, /tmp è l'unico posto dove il sistema può
      # scrivere, e stretto sarebbe un browser che si chiude da solo a metà pagina.
      - /tmp:size=512m,mode=1777
    shm_size: "1g"                  # un Chromium con finestra usa più memoria condivisa di uno cieco
    volumes:
      - lia_home:/home/lia          # la sua "casa" persistente (i suoi file, progetti, install)

  caddy:
    <<: *comune
    image: caddy:2
    # Serve solo per leggere EDGE_KEY (la chiave del nostro edge) e passarla al
    # bot col Caddyfile. Se non usi l'edge, resta vuota e non fa niente.
    env_file: .env
    ports:
      - "80:80"        # HTTP (redirect a HTTPS + sfida Let's Encrypt)
      - "443:443"      # HTTPS
      - "443:443/udp"  # HTTP/3 (QUIC)
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Le pagine di servizio: quella di manutenzione la mostra Caddy quando il
      # bot non risponde. E' una CARTELLA e non un file singolo di proposito —
      # un montaggio di file segue l'inode, e dopo un `git pull` che riscrive il
      # file il container continuerebbe a servire quello vecchio.
      - ./pagine-servizio:/srv/servizio:ro
      - caddy_data:/data       # qui Caddy conserva i certificati
      - caddy_config:/config
    # Caddy è la porta d'ingresso: regge l'urto di TUTTE le connessioni da
    # internet, quindi gli serve il tetto più alto di file aperti.
    ulimits:
      nofile:
        soft: 131072
        hard: 131072
    depends_on:
      - bot

volumes:
  caddy_data:
  caddy_config:
  lia_home:            # la "casa" persistente dell'ambiente di Lia

networks:
  # rete privata bot↔brain↔caddy: implicita, resta la "default".
  # `sandbox`: ponte SOLO fra il cervello e l'ambiente di Lia. È una bridge
  # normale (uscita internet per ricerche/svaghi), ma NON è la rete interna:
  # l'ambiente non raggiunge bot/Caddy né i loro dati. Per togliere anche
  # internet, aggiungi `internal: true` qui sotto.
  sandbox:
    driver: bridge
